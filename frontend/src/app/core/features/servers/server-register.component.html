<div class="max-w-xl mx-auto mt-8 p-6 bg-white rounded-lg shadow-md border border-gray-100">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Cadastrar Novo Servidor SQL</h2>
  
  <form [formGroup]="serverForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-2">Nome do Servidor</label>
      <input type="text" formControlName="nomeServidor" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: Produção PostgreSQL">
    </div>

    <!-- SGBD e Nome da Base de Dados -->
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-gray-700 font-medium mb-2">TIpo SGBD</label>
        <select formControlName="tipo" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="POSTGRES">Postgres</option>
          <option value="MYSQL">MySQL</option>
          <option value="H2">H2 Database</option>
          <option value="ORACLE">Oracle</option>
        </select>
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-2">Nome da Base de Dados</label>
        <input type="text" formControlName="databaseName" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: meu_banco">
      </div>
    </div>

    <!-- Host e Porta -->
    <div class="grid grid-cols-3 gap-4 mb-4">
      <div class="col-span-2">
        <label class="block text-gray-700 font-medium mb-2">Host / Endereço</label>
        <input type="text" formControlName="host" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: localhost">
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-2">Porta</label>
        <input type="number" formControlName="porta" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: 5432">
      </div>
    </div>

    <!-- Credenciais -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-gray-700 font-medium mb-2">Utilizador</label>
        <input type="text" formControlName="username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="postgres">
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-2">Palavra-passe</label>
        <input type="password" formControlName="senhaCriptografada" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
      </div>
    </div>

    <div class="flex justify-end space-x-4">
      <button type="submit" [disabled]="serverForm.invalid" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 disabled:opacity-50 transition-colors">
        Salvar Servidor
      </button>
    </div>
  </form>
</div>
