version: '3.8'

services:
  # Banco de Dados de Controle (PostgreSQL 17)
  postgres-controle:
    image: postgres:17-alpine
    container_name: postgres_controle
    environment:
      POSTGRES_DB: fullstack_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata_controle:/var/lib/postgresql/data
    networks:
      - network-sql-engine

  # Servidor MySQL
  mysql-server:
    image: mysql:8.0
    container_name: mysql_server
    environment:
      MYSQL_DATABASE: fullstack_lab
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - network-sql-engine

  # Keycloak para Autenticação e Gestão de Identidade
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak_server
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin     	  
    command: start-dev
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloack/data
    networks:
      - network-sql-engine

volumes:
  pgdata_controle:
  mysql_data:
  keycloak_data:

networks:
  network-sql-engine:
    driver: bridge