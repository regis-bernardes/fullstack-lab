spring:
  application:
    name: fullstack-lab
  datasource:
    url: jdbc:postgresql://localhost:55432/fullstack_lab
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fullstack_lab_realm
          jwk-set-uri: http://localhost:8180/realms/fullstack_lab_realm/protocol/openid-connect/certs

server:
  port: 8080

app:
  security:
    encryption:
      secret-key: "12345678901234567890123456789012" # Em produção, injetar via variável de ambiente
  