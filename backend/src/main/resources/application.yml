spring:
  application:
    name: execucao-sql-engine
  datasource:
    url: jdbc:postgresql://localhost:55432/db_controle_execucao
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/dbulinkedin-realm
          jwk-set-uri: http://localhost:8180/realms/dbulinkedin-realm/protocol/openid-connect/certs

server:
  port: 8080

app:
  security:
    encryption:
      secret-key: "12345678901234567890123456789012" # Em produção, injetar via variável de ambiente
  